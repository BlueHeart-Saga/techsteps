name: Build and deploy Astro to Azure Web App - TECHSTEPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Astro build
        run: |
          echo "Checking dist..."
          test -f dist/index.html
          echo "dist/index.html exists"
          find dist -maxdepth 2 -type f | head -50

      - name: Package for deployment
        run: |
          cd dist
          zip -r ../deploy.zip .
          cd ..

      - name: Deploy Astro static site to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TECHSTEPS'
          slot-name: 'Production'
          package: './deploy.zip'
          type: 'static'
          target-path: '/home/site/wwwroot'
          clean: true
          restart: true
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_07A0ED0BF0F74B2F8747A08AC90AAD0E }}