name: Build and deploy Astro to Azure - TECHSTEPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build
        env:
          NODE_ENV: production
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID || 'zjv69ibt' }}
          PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET || 'techsteps' }}
          SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID || secrets.SANITY_PROJECT_ID || 'zjv69ibt' }}
          SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET || secrets.SANITY_DATASET || 'techsteps' }}

      - name: Verify Astro output
        run: |
          echo "Checking Astro build..."
          test -f dist/index.html
          test -f dist/server.js
          test -f dist/package.json
          echo "dist/index.html and Azure server runner files exist"
          echo "Build output:"
          find dist -maxdepth 2 -type f | head -50

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TECHSTEPS'
          slot-name: 'Production'
          package: './dist'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_07A0ED0BF0F74B2F8747A08AC90AAD0E }}